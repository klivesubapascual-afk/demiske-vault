<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DemiSke Admin</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255, 0, 70, 0.35), transparent 35%),
        radial-gradient(circle at bottom right, rgba(255, 50, 0, 0.35), transparent 35%),
        linear-gradient(135deg, #100006, #1a0008, #070707);
      color: white;
      padding: 20px;
    }

    .admin-wrapper {
      max-width: 720px;
      margin: auto;
    }

    .admin-card {
      background: rgba(10, 10, 18, 0.88);
      border: 1px solid rgba(255, 70, 90, 0.35);
      border-radius: 28px;
      padding: 26px;
      box-shadow:
        0 0 25px rgba(255, 0, 70, 0.25),
        inset 0 0 20px rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(14px);
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(90deg, #ff2b4f, #ff6a00, #ff003c);
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 0 22px rgba(255, 0, 60, 0.45);
    }

    .header p {
      color: #ffc4cc;
      margin-top: 10px;
      font-size: 15px;
      line-height: 1.6;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin: 26px 0 14px;
      color: #ff8a9a;
    }

    .upload-box {
      border: 2px dashed rgba(255, 65, 95, 0.65);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      background: rgba(255, 20, 60, 0.06);
      cursor: pointer;
      transition: 0.25s ease;
    }

    .upload-box:hover {
      background: rgba(255, 20, 60, 0.13);
      transform: scale(1.01);
    }

    .upload-box input {
      display: none;
    }

    .upload-icon {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .upload-box strong {
      display: block;
      font-size: 16px;
      color: white;
    }

    .upload-box span {
      display: block;
      margin-top: 6px;
      font-size: 13px;
      color: #ffb6c1;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .preview-grid img {
      width: 100%;
      height: 95px;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid rgba(255, 80, 100, 0.5);
      box-shadow: 0 0 12px rgba(255, 0, 60, 0.25);
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ff9aaa;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 15px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 55, 90, 0.45);
      background: rgba(5, 5, 12, 0.92);
      color: white;
      font-size: 15px;
      outline: none;
      transition: 0.2s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #ff3155;
      box-shadow: 0 0 0 3px rgba(255, 49, 85, 0.18);
    }

    input::placeholder,
    textarea::placeholder {
      color: #777;
    }

    textarea {
      resize: none;
      height: 95px;
    }

    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 26px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 18px;
      padding: 16px;
      font-size: 16px;
      font-weight: 800;
      transition: 0.2s ease;
    }

    .save-btn {
      color: white;
      background: linear-gradient(135deg, #ff003c, #ff3b30, #ff7a00);
      box-shadow: 0 0 22px rgba(255, 0, 60, 0.35);
    }

    .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(255, 0, 60, 0.55);
    }

    .clear-btn {
      color: #ffb5bf;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .clear-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 390px;
      background:
        radial-gradient(circle at top, rgba(255, 0, 60, 0.25), transparent 45%),
        #111118;
      border: 1px solid rgba(255, 75, 100, 0.45);
      border-radius: 26px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 0 40px rgba(255, 0, 60, 0.4);
      animation: popup 0.25s ease;
    }

    @keyframes popup {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(15px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff003c, #ff7a00);
      font-size: 34px;
      box-shadow: 0 0 24px rgba(255, 0, 60, 0.5);
    }

    .modal h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .modal p {
      color: #ffc4cc;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .modal button {
      width: 100%;
      background: linear-gradient(135deg, #ff003c, #ff6a00);
      color: white;
    }

    .helper-text {
      font-size: 12px;
      color: #9f9f9f;
      margin-top: 7px;
    }

    @media (max-width: 560px) {
      body {
        padding: 14px;
      }

      .admin-card {
        padding: 22px 18px;
        border-radius: 24px;
      }

      .header h1 {
        font-size: 31px;
      }

      .two-column {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="admin-wrapper">
    <div class="admin-card">
      <div class="header">
        <h1>DemiSke Admin</h1>
        <p>
          Upload account pictures and details easily.  
          You can select multiple images for one account.
        </p>
      </div>

      <form id="adminForm">
        <div class="section-title">Account Pictures</div>

        <label class="upload-box" for="accountPictures">
          <input type="file" id="accountPictures" multiple accept="image/*" />
          <div class="upload-icon">📸</div>
          <strong>Tap to upload pictures</strong>
          <span>Multiple images allowed</span>
        </label>

        <div id="previewGrid" class="preview-grid"></div>

        <div class="section-title">Account Details</div>

        <div class="form-group">
          <label>Account Name</label>
          <input type="text" id="accountName" placeholder="Example: KhunICE Account" required />
        </div>

        <div class="two-column">
          <div class="form-group">
            <label>Level</label>
            <input type="text" id="level" placeholder="Example: Level 184" required />
          </div>

          <div class="form-group">
            <label>Price</label>
            <input type="number" id="price" placeholder="Example: 550" required />
          </div>
        </div>

        <div class="two-column">
          <div class="form-group">
            <label>UID</label>
            <input type="text" id="uid" placeholder="Example: 361673204" />
          </div>

          <div class="form-group">
            <label>Region</label>
            <input type="text" id="region" placeholder="Example: TH" />
          </div>
        </div>

        <div class="form-group">
          <label>Nickname</label>
          <input type="text" id="nickname" placeholder="Example: DemiSke Buyer" />
        </div>

        <div class="form-group">
          <label>Category</label>
          <select id="category">
            <option value="">Select category</option>
            <option value="150-200">₱150 - ₱200</option>
            <option value="201-500">₱201 - ₱500</option>
            <option value="501-1000">₱501 - ₱1000</option>
            <option value="1000+">₱1000+</option>
          </select>
          <div class="helper-text">This helps customers find accounts by budget.</div>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea id="description" placeholder="Add notes, skins, rare items, or login details..."></textarea>
        </div>

        <div class="btn-row">
          <button type="submit" class="save-btn">Save Account</button>
          <button type="button" class="clear-btn" onclick="clearForm()">Clear Form</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="successModal">
    <div class="modal">
      <div class="modal-icon">✓</div>
      <h2>Account Saved</h2>
      <p>
        Your account details have been saved successfully.
        You can now add another account.
      </p>
      <button onclick="closeModal()">Done</button>
    </div>
  </div>

  <script>
    const imageInput = document.getElementById("accountPictures");
    const previewGrid = document.getElementById("previewGrid");
    const adminForm = document.getElementById("adminForm");
    const successModal = document.getElementById("successModal");

    imageInput.addEventListener("change", function () {
      previewGrid.innerHTML = "";

      const files = Array.from(imageInput.files);

      files.forEach(file => {
        const reader = new FileReader();

        reader.onload = function (e) {
          const img = document.createElement("img");
          img.src = e.target.result;
          previewGrid.appendChild(img);
        };

        reader.readAsDataURL(file);
      });
    });

    adminForm.addEventListener("submit", function (e) {
      e.preventDefault();

      const accountData = {
        accountName: document.getElementById("accountName").value,
        level: document.getElementById("level").value,
        price: document.getElementById("price").value,
        uid: document.getElementById("uid").value,
        region: document.getElementById("region").value,
        nickname: document.getElementById("nickname").value,
        category: document.getElementById("category").value,
        description: document.getElementById("description").value,
        imagesCount: imageInput.files.length
      };

      console.log("Saved Account:", accountData);

      successModal.classList.add("active");
    });

    function closeModal() {
      successModal.classList.remove("active");
      clearForm();
    }

    function clearForm() {
      adminForm.reset();
      previewGrid.innerHTML = "";
    }
  </script>
</body>
</html>
