<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DemiGods Admin</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#050005;color:white}.bg{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;z-index:0;filter:brightness(1.08) saturate(1.18)}.ov{position:fixed;inset:0;z-index:1;background:linear-gradient(135deg,rgba(0,0,0,.25),rgba(0,0,0,.65))}.wrap{position:relative;z-index:2;max-width:980px;margin:auto;padding:18px}.glass{border:1px solid rgba(255,70,95,.38);background:rgba(10,10,18,.64);backdrop-filter:blur(10px);border-radius:26px;box-shadow:0 0 22px rgba(255,0,60,.15)}.top{display:flex;gap:12px;align-items:center}.logo{width:60px;height:60px;border-radius:20px;background:#100;display:grid;place-items:center;font-size:30px;font-weight:900;border:1px solid rgba(255,70,95,.45)}.brand h1{font-size:34px;background:linear-gradient(90deg,#ff003c,#ff6a00);-webkit-background-clip:text;color:transparent}.brand p{color:#aaa}.panel{padding:18px;margin:16px 0}.title{margin:24px 0 10px}.title h2{font-size:34px}.title p{color:#aaa}.typegrid,.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}button{border:0;border-radius:16px;padding:14px;color:#fff;font-weight:900;background:rgba(255,255,255,.07)}.active,.primary{background:linear-gradient(135deg,#ff003c,#ff6a00)!important}.green{background:linear-gradient(135deg,#00c853,#00ff88)}.danger{background:rgba(255,0,60,.65)}.field{margin:12px 0}.field label{display:block;color:#ffb8c2;font-weight:900;margin-bottom:7px}input,textarea{width:100%;border-radius:16px;border:1px solid rgba(255,70,95,.35);background:rgba(0,0,0,.35);color:#fff;padding:14px;outline:0}.hidden{display:none!important}.previews{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.previews img{width:95px;height:95px;object-fit:cover;border-radius:16px;border:1px solid rgba(255,70,95,.35)}.status{padding:13px;border-radius:16px;border:1px solid rgba(255,70,95,.35);background:rgba(255,255,255,.06);color:#ffd1d8;font-weight:900;margin:12px 0;display:none}.product{display:grid;grid-template-columns:96px 1fr;gap:13px;padding:13px;margin:12px 0}.pimg{width:96px;height:96px;border-radius:16px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:35px;overflow:hidden}.pimg img{width:100%;height:100%;object-fit:cover}.login{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{width:100%;max-width:390px;padding:24px}.order{padding:15px;margin:12px 0}</style></head><body><video class="bg" autoplay muted loop playsinline><source src="bg.mp4" type="video/mp4"></video><div class="ov"></div><div class="login" id="login"><div class="loginbox glass"><h2>DemiGods Admin</h2><p style="color:#aaa;margin:8px 0 18px">Login to manage products.</p><div class="field"><label>Username</label><input id="adminUser"></div><div class="field"><label>Password</label><input id="adminPass" type="password"></div><button class="primary" style="width:100%" onclick="adminLogin()">LOGIN</button></div></div><main class="wrap"><header class="top"><div class="logo">D</div><div class="brand"><h1>DemiGods Admin</h1><p>Product and order control panel</p></div></header><section class="panel glass"><div class="title"><h2>Add Product</h2><p>Upload directly to Firebase.</p></div><div class="typegrid"><button class="typeBtn active" onclick="selectType('account',this)">🎮 Account</button><button class="typeBtn" onclick="selectType('key',this)">🔑 Key</button><button class="typeBtn" onclick="selectType('other',this)">📦 Service</button></div><div class="field"><label>Pictures</label><input id="pics" type="file" accept="image/*" multiple onchange="previewImages()"></div><div class="previews" id="previews"></div><div id="account"><div class="grid2"><div class="field"><label>Account Name</label><input id="accountName"></div><div class="field"><label>Price</label><input id="accountPrice" type="number"></div><div class="field"><label>Level</label><input id="accountLevel"></div><div class="field"><label>UID</label><input id="accountUid"></div><div class="field"><label>Region</label><input id="accountRegion"></div></div><div class="field"><label>Description</label><textarea id="accountDescription" rows="4"></textarea></div></div><div id="key" class="hidden"><div class="grid2"><div class="field"><label>Key Name</label><input id="keyName"></div><div class="field"><label>Price</label><input id="keyPrice" type="number"></div><div class="field"><label>Duration</label><input id="keyDuration"></div><div class="field"><label>Game</label><input id="keyGame"></div><div class="field"><label>Platform</label><input id="keyPlatform"></div></div><div class="field"><label>Description</label><textarea id="keyDescription" rows="4"></textarea></div></div><div id="other" class="hidden"><div class="grid2"><div class="field"><label>Service Name</label><input id="otherName"></div><div class="field"><label>Price</label><input id="otherPrice" type="number"></div><div class="field"><label>Category</label><input id="otherCategory"></div></div><div class="field"><label>Description</label><textarea id="otherDescription" rows="4"></textarea></div></div><button class="green" style="width:100%" onclick="saveProduct()">UPLOAD PRODUCT</button><div class="status" id="status"></div></section><section><div class="title"><h2>Firebase Products</h2></div><div id="products"><div class="panel glass">Loading products...</div></div></section><section><div class="title"><h2>Recent Orders</h2></div><div id="orders"><div class="panel glass">Loading orders...</div></div></section></main><script>const DB='https://demiske-vault-default-rtdb.asia-southeast1.firebasedatabase.app',USER='xylosellers',PASS='modtakels ni xylo';let type='account';function $(id){return document.getElementById(id)}function val(id){return($(id)?.value||'').trim()}function safe(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function money(v){return'₱'+Number(v||0).toLocaleString('en-PH')}function icon(t){return t==='account'?'🎮':t==='key'?'🔑':'📦'}function status(m){$('status').style.display='block';$('status').innerText=m}function adminLogin(){if(val('adminUser')===USER&&val('adminPass')===PASS){localStorage.setItem('adminLogged','1');$('login').style.display='none'}else alert('Wrong admin login.')}if(localStorage.getItem('adminLogged')==='1')$('login').style.display='none';function selectType(t,b){type=t;document.querySelectorAll('.typeBtn').forEach(x=>x.classList.remove('active'));b?.classList.add('active');['account','key','other'].forEach(id=>$(id).classList.toggle('hidden',id!==t))}function previewImages(){let g=$('previews');g.innerHTML='';Array.from($('pics').files||[]).slice(0,3).forEach(f=>{let r=new FileReader();r.onload=e=>{let img=document.createElement('img');img.src=e.target.result;g.appendChild(img)};r.readAsDataURL(f)})}function compress(file){return new Promise((res,rej)=>{let r=new FileReader(),img=new Image();r.onload=e=>{img.onload=()=>{let c=document.createElement('canvas'),max=520,w=img.width,h=img.height;if(w>h&&w>max){h=Math.round(h*max/w);w=max}else if(h>max){w=Math.round(w*max/h);h=max}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',.38))};img.onerror=rej;img.src=e.target.result};r.onerror=rej;r.readAsDataURL(file)})}async function getImages(){let arr=[];let files=Array.from($('pics').files||[]).slice(0,3);for(let i=0;i<files.length;i++){status(`Compressing image ${i+1}/${files.length}...`);arr.push(await compress(files[i]))}return arr}async function saveProduct(){let id=String(Date.now()),images=await getImages();let p={id,productType:type,images,imagesCount:images.length,seller:'demi',status:'available',featured:false,createdAt:new Date().toLocaleString()};if(type==='account'){if(!val('accountName')||!val('accountPrice')){alert('Account name and price required.');return}Object.assign(p,{name:val('accountName'),price:Number(val('accountPrice'))||0,level:val('accountLevel'),uid:val('accountUid'),region:val('accountRegion'),description:val('accountDescription')})}if(type==='key'){if(!val('keyName')||!val('keyPrice')){alert('Key name and price required.');return}Object.assign(p,{name:val('keyName'),price:Number(val('keyPrice'))||0,duration:val('keyDuration'),game:val('keyGame'),platform:val('keyPlatform'),description:val('keyDescription')})}if(type==='other'){if(!val('otherName')||!val('otherPrice')){alert('Service name and price required.');return}Object.assign(p,{name:val('otherName'),price:Number(val('otherPrice'))||0,category:val('otherCategory'),description:val('otherDescription'),availability:'Available'})}status('Uploading to Firebase...');let r=await fetch(DB+'/products/'+id+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});if(!r.ok){status('Upload failed: '+await r.text());return}status('✅ Uploaded successfully. Product ID: '+id);loadProducts()}async function loadProducts(){let r=await fetch(DB+'/products.json?ts='+Date.now()),d=await r.json()||{},list=Object.values(d).sort((a,b)=>Number(b.id||0)-Number(a.id||0));$('products').innerHTML=list.length?list.map(p=>`<div class="product glass"><div class="pimg">${p.images&&p.images[0]?`<img src="${p.images[0]}">`:icon(p.productType)}</div><div><h3>${safe(p.name)}</h3><p style="color:#bbb;line-height:1.5">Type: ${safe((p.productType||'product').toUpperCase())}<br>Price: ${money(p.price)}<br>ID: ${safe(p.id)}</p><button class="danger" onclick="deleteProduct('${safe(p.id)}')">Delete</button></div></div>`).join(''):'<div class="panel glass">No products yet.</div>'}async function deleteProduct(id){if(!confirm('Delete product?'))return;await fetch(DB+'/products/'+id+'.json',{method:'DELETE'});loadProducts()}async function loadOrders(){let r=await fetch(DB+'/orders.json?ts='+Date.now()),d=await r.json()||{},orders=Object.values(d).sort((a,b)=>Number(b.createdAtMs||0)-Number(a.createdAtMs||0));$('orders').innerHTML=orders.length?orders.slice(0,15).map(o=>`<div class="order glass"><h3>${safe(o.orderId)} — ${safe(o.productName)}</h3><p style="color:#bbb;line-height:1.5">Customer: ${safe(o.customerName)}<br>Contact: ${safe(o.contact)}<br>Price: ${money(o.price)}<br>Status: ${safe(o.status)}</p></div>`).join(''):'<div class="panel glass">No orders yet.</div>'}loadProducts();loadOrders();setInterval(loadProducts,8000);setInterval(loadOrders,8000);</script></body></html>

<script>
/* ADMIN ORDER ACCEPT + LEADERBOARD FIX */
(function () {
  const DB = "https://demiske-vault-default-rtdb.asia-southeast1.firebasedatabase.app";

  function safe(v) {
    return String(v ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  function money(v) {
    return "₱" + Number(v || 0).toLocaleString("en-PH");
  }

  function statusClass(status) {
    status = String(status || "Pending").toLowerCase();

    if (status === "accepted") return "status-accepted";
    if (status === "completed") return "status-completed";
    if (status === "cancelled") return "status-cancelled";

    return "status-pending";
  }

  async function getOrders() {
    const res = await fetch(DB + "/orders.json?ts=" + Date.now());
    const data = await res.json() || {};

    return Object.values(data).sort(function (a, b) {
      return Number(b.createdAtMs || String(b.orderId || "").replace(/\D/g, "") || 0)
        - Number(a.createdAtMs || String(a.orderId || "").replace(/\D/g, "") || 0);
    });
  }

  async function updateOrderStatus(orderId, status) {
    if (!orderId) {
      alert("Order ID missing.");
      return;
    }

    const res = await fetch(DB + "/orders/" + orderId + ".json", {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        status: status,
        updatedAt: new Date().toLocaleString(),
        updatedAtMs: Date.now()
      })
    });

    if (!res.ok) {
      alert("Failed to update order: " + await res.text());
      return;
    }

    alert("Order marked as " + status + ".");
    loadAdminOrdersAndLeaderboard();
  }

  window.acceptOrder = function (orderId) {
    updateOrderStatus(orderId, "Accepted");
  };

  window.completeOrder = function (orderId) {
    updateOrderStatus(orderId, "Completed");
  };

  window.cancelOrder = function (orderId) {
    if (!confirm("Cancel this order?")) return;
    updateOrderStatus(orderId, "Cancelled");
  };

  function renderOrders(orders) {
    const box = document.getElementById("orders");
    if (!box) return;

    if (!orders.length) {
      box.innerHTML = `<div class="panel">No orders yet.</div>`;
      return;
    }

    box.innerHTML = `
      <div class="order-tools">
        ${orders.map(function (o) {
          const status = o.status || "Pending";

          return `
            <div class="order-card">
              <h3>${safe(o.orderId || "Order")} — ${safe(o.productName || "Product")}</h3>

              <span class="order-status ${statusClass(status)}">${safe(status).toUpperCase()}</span>

              <p>
                <b>Customer:</b> ${safe(o.customerName || "Unknown")}<br>
                <b>Contact:</b> ${safe(o.contact || "N/A")}<br>
                <b>Payment:</b> ${safe(o.paymentMethod || "N/A")}<br>
                <b>Price:</b> ${money(o.price)}<br>
                <b>Note:</b> ${safe(o.note || "None")}<br>
                <b>Date:</b> ${safe(o.createdAt || "N/A")}
              </p>

              <div class="order-actions">
                <button class="accept-btn" onclick="acceptOrder('${safe(o.orderId)}')">Accept</button>
                <button class="complete-btn" onclick="completeOrder('${safe(o.orderId)}')">Complete</button>
                <button class="cancel-btn" onclick="cancelOrder('${safe(o.orderId)}')">Cancel</button>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `;
  }

  function ensureLeaderboardBox() {
    let box = document.getElementById("customerLeaderboardBox");

    if (!box) {
      const section = document.createElement("section");
      section.innerHTML = `
        <div class="title">
          <h2>🏆 Customer Leaderboard</h2>
          <p>Top customers by orders and total spent.</p>
        </div>
        <div id="customerLeaderboardBox">
          <div class="panel">Loading leaderboard...</div>
        </div>
      `;

      const ordersBox = document.getElementById("orders");

      if (ordersBox && ordersBox.parentElement) {
        ordersBox.parentElement.after(section);
      } else {
        document.querySelector("main")?.appendChild(section);
      }

      box = document.getElementById("customerLeaderboardBox");
    }

    return box;
  }

  function renderLeaderboard(orders) {
    const box = ensureLeaderboardBox();

    const map = {};

    orders.forEach(function (o) {
      const key = String(o.contact || o.customerName || "unknown").toLowerCase();
      const status = String(o.status || "Pending").toLowerCase();

      if (!map[key]) {
        map[key] = {
          name: o.customerName || "Unknown Customer",
          contact: o.contact || "No contact",
          total: 0,
          orders: 0,
          pending: 0,
          accepted: 0,
          completed: 0,
          cancelled: 0
        };
      }

      map[key].orders += 1;

      if (status === "completed") {
        map[key].completed += 1;
        map[key].total += Number(o.price || 0);
      } else if (status === "accepted") {
        map[key].accepted += 1;
      } else if (status === "cancelled") {
        map[key].cancelled += 1;
      } else {
        map[key].pending += 1;
      }
    });

    const leaders = Object.values(map)
      .sort(function (a, b) {
        return b.total - a.total || b.completed - a.completed || b.orders - a.orders;
      })
      .slice(0, 10);

    if (!leaders.length) {
      box.innerHTML = `<div class="panel">No leaderboard data yet.</div>`;
      return;
    }

    box.innerHTML = leaders.map(function (c, index) {
      return `
        <div class="leaderboard-card">
          <div class="leader-rank">${index + 1}</div>

          <div class="leader-info">
            <h3>${safe(c.name)}</h3>
            <p>
              ${safe(c.contact)}<br>
              ${c.orders} total order(s) • ${c.completed} completed • ${c.pending} pending
            </p>
          </div>

          <div class="leader-total">
            <strong>${money(c.total)}</strong>
            <span>Completed spent</span>
          </div>
        </div>
      `;
    }).join("");
  }

  window.loadAdminOrdersAndLeaderboard = async function () {
    try {
      const orders = await getOrders();
      renderOrders(orders);
      renderLeaderboard(orders);
    } catch (error) {
      const box = document.getElementById("orders");
      if (box) box.innerHTML = `<div class="panel">Order load error: ${safe(error.message)}</div>`;
    }
  };

  // Override old loadOrders if present
  window.loadOrders = window.loadAdminOrdersAndLeaderboard;

  document.addEventListener("DOMContentLoaded", function () {
    setTimeout(loadAdminOrdersAndLeaderboard, 500);
    setInterval(loadAdminOrdersAndLeaderboard, 6000);
  });

  setTimeout(loadAdminOrdersAndLeaderboard, 800);
})();
</script>


<script>
/* FINAL ORDER FLOW FIX:
   - Accept opens buyer Telegram
   - Complete archives order then removes it from active orders
   - Leaderboard counts completed archive
*/
(function () {
  const DB = "https://demiske-vault-default-rtdb.asia-southeast1.firebasedatabase.app";

  function safe(v) {
    return String(v ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  function money(v) {
    return "₱" + Number(v || 0).toLocaleString("en-PH");
  }

  function telegramLink(contact) {
    contact = String(contact || "").trim();

    if (!contact) return "https://t.me/Demixyloadmin";

    if (contact.includes("t.me/")) {
      if (contact.startsWith("http")) return contact;
      return "https://" + contact.replace(/^\/+/, "");
    }

    if (contact.startsWith("@")) {
      return "https://t.me/" + contact.slice(1);
    }

    // remove spaces and symbols for username fallback
    const cleaned = contact.replace(/[^a-zA-Z0-9_]/g, "");

    if (cleaned) {
      return "https://t.me/" + cleaned;
    }

    return "https://t.me/Demixyloadmin";
  }

  async function getOrder(orderId) {
    const res = await fetch(DB + "/orders/" + orderId + ".json?ts=" + Date.now());
    return await res.json();
  }

  async function patchOrder(orderId, data) {
    return fetch(DB + "/orders/" + orderId + ".json", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });
  }

  async function deleteActiveOrder(orderId) {
    return fetch(DB + "/orders/" + orderId + ".json", {
      method: "DELETE"
    });
  }

  async function archiveCompletedOrder(orderId, order) {
    return fetch(DB + "/completedOrders/" + orderId + ".json", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        ...order,
        status: "Completed",
        completedAt: new Date().toLocaleString(),
        completedAtMs: Date.now()
      })
    });
  }

  window.messageBuyer = function (contact) {
    location.href = telegramLink(contact);
  };

  window.acceptOrder = async function (orderId) {
    const order = await getOrder(orderId);

    if (!order) {
      alert("Order not found.");
      return;
    }

    const res = await patchOrder(orderId, {
      status: "Accepted",
      acceptedAt: new Date().toLocaleString(),
      acceptedAtMs: Date.now()
    });

    if (!res.ok) {
      alert("Failed to accept order: " + await res.text());
      return;
    }

    alert("Order accepted. Opening buyer Telegram...");
    location.href = telegramLink(order.contact);

    if (typeof loadOrders === "function") {
      setTimeout(loadOrders, 500);
    }
  };

  window.completeOrder = async function (orderId) {
    const order = await getOrder(orderId);

    if (!order) {
      alert("Order not found.");
      return;
    }

    if (!confirm("Mark this order as complete and remove it from active orders?")) {
      return;
    }

    const archiveRes = await archiveCompletedOrder(orderId, order);

    if (!archiveRes.ok) {
      alert("Failed to archive completed order: " + await archiveRes.text());
      return;
    }

    const deleteRes = await deleteActiveOrder(orderId);

    if (!deleteRes.ok) {
      alert("Archived, but failed to delete active order: " + await deleteRes.text());
      return;
    }

    alert("Order completed and removed from active orders.");

    if (typeof loadOrders === "function") {
      loadOrders();
    }
  };

  window.cancelOrder = async function (orderId) {
    if (!confirm("Cancel and delete this order?")) return;

    const order = await getOrder(orderId);

    await fetch(DB + "/cancelledOrders/" + orderId + ".json", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        ...(order || {}),
        status: "Cancelled",
        cancelledAt: new Date().toLocaleString(),
        cancelledAtMs: Date.now()
      })
    });

    await deleteActiveOrder(orderId);

    alert("Order cancelled and removed.");

    if (typeof loadOrders === "function") {
      loadOrders();
    }
  };

  async function loadActiveOrders() {
    const res = await fetch(DB + "/orders.json?ts=" + Date.now());
    const data = await res.json() || {};
    return Object.values(data).sort((a, b) => Number(b.createdAtMs || 0) - Number(a.createdAtMs || 0));
  }

  async function loadCompletedOrders() {
    const res = await fetch(DB + "/completedOrders.json?ts=" + Date.now());
    const data = await res.json() || {};
    return Object.values(data).sort((a, b) => Number(b.completedAtMs || 0) - Number(a.completedAtMs || 0));
  }

  function statusClass(s) {
    s = String(s || "Pending").toLowerCase();
    if (s === "accepted") return "accepted";
    if (s === "completed") return "completed";
    if (s === "cancelled") return "cancelled";
    return "pending";
  }

  function renderActiveOrders(orders) {
    const box = document.getElementById("ordersList") || document.getElementById("orders");
    if (!box) return;

    if (!orders.length) {
      box.innerHTML = `<div class="panel">No active orders.</div>`;
      return;
    }

    box.innerHTML = orders.map(o => {
      const status = o.status || "Pending";
      return `
        <div class="order-card">
          <h3>${safe(o.orderId || "Order")} — ${safe(o.productName || "Product")}</h3>
          <span class="order-status ${statusClass(status)}">${safe(status).toUpperCase()}</span>

          <p>
            <b>Customer:</b> ${safe(o.customerName || "Unknown")}<br>
            <b>Telegram:</b> ${safe(o.contact || "N/A")}<br>
            <b>Payment:</b> ${safe(o.paymentMethod || "N/A")}<br>
            <b>Price:</b> ${money(o.price)}<br>
            <b>Note:</b> ${safe(o.note || "None")}<br>
            <b>Date:</b> ${safe(o.createdAt || "N/A")}
          </p>

          <div class="order-actions">
            <button class="blue" onclick="acceptOrder('${safe(o.orderId)}')">Accept + TG</button>
            <button class="green" onclick="completeOrder('${safe(o.orderId)}')">Complete</button>
            <button class="danger" onclick="cancelOrder('${safe(o.orderId)}')">Cancel</button>
          </div>

          <button style="width:100%;margin-top:8px" onclick="messageBuyer('${safe(o.contact || "")}')">
            📩 Message Buyer on Telegram
          </button>
        </div>
      `;
    }).join("");
  }

  function renderLeaderboardFromCompleted(completed, active) {
    const box = document.getElementById("leaderList") || document.getElementById("customerLeaderboardBox");
    if (!box) return;

    const map = {};

    completed.forEach(o => {
      const key = String(o.contact || o.customerName || "unknown").toLowerCase();

      if (!map[key]) {
        map[key] = {
          name: o.customerName || "Unknown",
          contact: o.contact || "No contact",
          completed: 0,
          pending: 0,
          total: 0
        };
      }

      map[key].completed++;
      map[key].total += Number(o.price || 0);
    });

    active.forEach(o => {
      const key = String(o.contact || o.customerName || "unknown").toLowerCase();

      if (!map[key]) {
        map[key] = {
          name: o.customerName || "Unknown",
          contact: o.contact || "No contact",
          completed: 0,
          pending: 0,
          total: 0
        };
      }

      map[key].pending++;
    });

    const leaders = Object.values(map)
      .sort((a, b) => b.total - a.total || b.completed - a.completed)
      .slice(0, 10);

    if (!leaders.length) {
      box.innerHTML = `<div class="panel">No leaderboard data yet.</div>`;
      return;
    }

    box.innerHTML = leaders.map((c, i) => `
      <div class="leader-card">
        <div class="rank">${i + 1}</div>
        <div>
          <h3>${safe(c.name)}</h3>
          <p>
            ${safe(c.contact)}<br>
            ${c.completed} completed • ${c.pending} active/pending
          </p>
        </div>
        <div class="total">
          <strong>${money(c.total)}</strong>
          <span>Completed spent</span>
        </div>
      </div>
    `).join("");
  }

  window.loadOrders = async function () {
    const active = await loadActiveOrders();
    const completed = await loadCompletedOrders();

    renderActiveOrders(active);
    renderLeaderboardFromCompleted(completed, active);

    const stats = document.getElementById("orderSummaryStats");
    if (stats) {
      stats.innerHTML = `
        <div class="stat"><strong>${active.length}</strong><span>Active orders</span></div>
        <div class="stat"><strong>${active.filter(o => String(o.status || "Pending").toLowerCase() === "pending").length}</strong><span>Pending</span></div>
        <div class="stat"><strong>${completed.length}</strong><span>Completed archived</span></div>
      `;
    }
  };

  setTimeout(window.loadOrders, 500);
  setInterval(window.loadOrders, 6000);
})();
</script>

<script>
/* PREMIUM GAME-STYLE LEADERBOARD */
(function () {
  const DB = "https://demiske-vault-default-rtdb.asia-southeast1.firebasedatabase.app";

  function safe(v) {
    return String(v ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  function scoreMoney(v) {
    return Number(v || 0).toLocaleString("en-PH");
  }

  function initials(name) {
    name = String(name || "DG").trim();

    const parts = name.split(/\s+/).filter(Boolean);

    if (parts.length >= 2) {
      return (parts[0][0] + parts[1][0]).toUpperCase();
    }

    return name.slice(0, 2).toUpperCase();
  }

  async function getActiveOrders() {
    const res = await fetch(DB + "/orders.json?ts=" + Date.now());
    const data = await res.json() || {};
    return Object.values(data);
  }

  async function getCompletedOrders() {
    const res = await fetch(DB + "/completedOrders.json?ts=" + Date.now());
    const data = await res.json() || {};
    return Object.values(data);
  }

  async function buildLeaderboard() {
    const active = await getActiveOrders();
    const completed = await getCompletedOrders();

    const map = {};

    completed.forEach(o => {
      const key = String(o.contact || o.customerName || "unknown").toLowerCase();

      if (!map[key]) {
        map[key] = {
          name: o.customerName || "Unknown",
          contact: o.contact || "@username",
          score: 0,
          completed: 0,
          pending: 0
        };
      }

      map[key].score += Number(o.price || 0);
      map[key].completed++;
    });

    active.forEach(o => {
      const key = String(o.contact || o.customerName || "unknown").toLowerCase();

      if (!map[key]) {
        map[key] = {
          name: o.customerName || "Unknown",
          contact: o.contact || "@username",
          score: 0,
          completed: 0,
          pending: 0
        };
      }

      map[key].pending++;
    });

    return Object.values(map)
      .sort((a, b) => b.score - a.score || b.completed - a.completed || b.pending - a.pending)
      .slice(0, 20);
  }

  function topCard(user, rank) {
    if (!user) {
      return `
        <div class="lb-top-card rank-${rank}">
          <div class="lb-avatar-wrap">
            ${rank === 1 ? `<div class="lb-crown">👑</div>` : ""}
            <div class="lb-avatar">?</div>
            <div class="lb-rank-badge">${rank}</div>
          </div>
          <div class="lb-name">Empty</div>
          <div class="lb-score">0</div>
          <div class="lb-contact">@username</div>
        </div>
      `;
    }

    return `
      <div class="lb-top-card rank-${rank}">
        <div class="lb-avatar-wrap">
          ${rank === 1 ? `<div class="lb-crown">👑</div>` : ""}
          <div class="lb-avatar">${initials(user.name)}</div>
          <div class="lb-rank-badge">${rank}</div>
        </div>
        <div class="lb-name">${safe(user.name)}</div>
        <div class="lb-score">${scoreMoney(user.score)}</div>
        <div class="lb-contact">${safe(user.contact || "@username")}</div>
      </div>
    `;
  }

  function row(user, index) {
    return `
      <div class="lb-row">
        <div class="lb-small-avatar">${initials(user.name)}</div>

        <div>
          <div class="lb-row-name">${safe(user.name)}</div>
          <div class="lb-row-contact">${safe(user.contact || "@username")}</div>
        </div>

        <div class="lb-row-score">
          ${scoreMoney(user.score)}
          <span class="lb-trend">▲ #${index + 1}</span>
        </div>
      </div>
    `;
  }

  window.openPremiumLeaderboard = async function () {
    document.querySelectorAll(".section").forEach(s => s.classList.add("hidden"));

    let section = document.getElementById("premiumLeaderboard");

    if (!section) {
      section = document.createElement("section");
      section.id = "premiumLeaderboard";
      section.className = "section lb-screen";

      const main = document.querySelector("main") || document.body;
      main.appendChild(section);
    }

    section.classList.remove("hidden");

    section.innerHTML = `
      <div class="lb-header">
        <button class="lb-back" onclick="goSection('add', document.querySelector('.tab'))">‹</button>
        <div class="lb-title">Leaderboard</div>
        <button class="lb-menu">✥</button>
      </div>

      <div class="lb-tabs">
        <button class="lb-tab active">Region</button>
        <button class="lb-tab">National</button>
        <button class="lb-tab">Global</button>
      </div>

      <div class="lb-empty">Loading leaderboard...</div>
    `;

    const leaders = await buildLeaderboard();

    if (!leaders.length) {
      section.innerHTML += `<div class="lb-empty">No completed customers yet.</div>`;
      return;
    }

    const first = leaders[0];
    const second = leaders[1];
    const third = leaders[2];
    const rest = leaders.slice(3);

    section.innerHTML = `
      <div class="lb-header">
        <button class="lb-back" onclick="goSection('add', document.querySelector('.tab'))">‹</button>
        <div class="lb-title">Leaderboard</div>
        <button class="lb-menu">✥</button>
      </div>

      <div class="lb-tabs">
        <button class="lb-tab active">Region</button>
        <button class="lb-tab">National</button>
        <button class="lb-tab">Global</button>
      </div>

      <div class="lb-podium">
        ${topCard(second, 2)}
        ${topCard(first, 1)}
        ${topCard(third, 3)}
      </div>

      <div class="lb-list">
        ${
          rest.length
          ? rest.map((u, i) => row(u, i + 3)).join("")
          : `<div class="lb-empty">No more customers yet.</div>`
        }
      </div>
    `;

    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  document.addEventListener("DOMContentLoaded", function () {
    if (!document.getElementById("premiumLeaderboardBtn")) {
      const btn = document.createElement("button");
      btn.id = "premiumLeaderboardBtn";
      btn.className = "premium-leaderboard-btn";
      btn.innerHTML = "🏆 Open Premium Leaderboard";
      btn.onclick = window.openPremiumLeaderboard;

      const tabs = document.querySelector(".tabs");
      if (tabs) tabs.after(btn);
      else document.querySelector("main")?.prepend(btn);
    }

    const oldLeaderboardTab = Array.from(document.querySelectorAll("button"))
      .find(btn => (btn.textContent || "").toLowerCase().trim() === "leaderboard");

    if (oldLeaderboardTab) {
      oldLeaderboardTab.onclick = window.openPremiumLeaderboard;
    }
  });
})();
</script>


<script>
/* MAKE LEADERBOARD REGION / NATIONAL / GLOBAL TABS CLICKABLE */
(function () {
  window.currentLeaderboardTab = "Region";

  window.switchLeaderboardTab = function (tabName, btn) {
    window.currentLeaderboardTab = tabName;

    document.querySelectorAll(".lb-tab").forEach(function (tab) {
      tab.classList.remove("active");

    if (btn) {

    if (title) {

      openPremiumLeaderboard();

        const tabs = document.querySelectorAll(".lb-tab");

        tabs.forEach(function (tab) {
          tab.classList.remove("active");

          if (tab.textContent.trim() === tabName) {
            tab.classList.add("active");
          }
        });

        const newTitle = document.querySelector(".lb-title");
        if (newTitle) {
          newTitle.innerText = tabName + " Leaderboard";

    e.preventDefault();

    switchLeaderboardTab(tabName, btn);
  }, true);
})();

<script>
/* AUTO DELETE PRODUCT WHEN ORDER IS COMPLETED */
(function () {
  const DB = "https://demiske-vault-default-rtdb.asia-southeast1.firebasedatabase.app";

  async function getOrder(orderId) {
    const res = await fetch(DB + "/orders/" + orderId + ".json?ts=" + Date.now());
    return await res.json();
  }

  async function getProducts() {
    const res = await fetch(DB + "/products.json?ts=" + Date.now());
    return await res.json() || {};
  }

  async function archiveCompletedOrder(orderId, order, productDeleted) {
    return fetch(DB + "/completedOrders/" + orderId + ".json", {
      method: "PUT",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        ...order,
        status: "Completed",
        productDeleted: productDeleted,
        completedAt: new Date().toLocaleString(),
        completedAtMs: Date.now()
      })
    });
  }

  async function deleteActiveOrder(orderId) {
    return fetch(DB + "/orders/" + orderId + ".json", {
      method: "DELETE"
    });
  }

  async function deleteProductFromCustomerShop(order) {
    if (!order) return false;

    // Best way: delete by productId
    if (order.productId) {
      const res = await fetch(DB + "/products/" + order.productId + ".json", {
        method: "DELETE"
      });

      return res.ok;
    }

    // Backup way: delete by matching product name
    const products = await getProducts();
    const entries = Object.entries(products);

    const found = entries.find(([id, product]) => {
      return String(product.name || "").trim().toLowerCase() === String(order.productName || "").trim().toLowerCase();
    });

    if (!found) return false;

    const productId = found[0];

    const res = await fetch(DB + "/products/" + productId + ".json", {
      method: "DELETE"
    });

    return res.ok;
  }

  window.completeOrder = async function (orderId) {
    const order = await getOrder(orderId);

    if (!order) {
      alert("Order not found.");
      return;
    }

    if (!confirm("Complete this order? This will also delete the product from the customer shop.")) {
      return;
    }

    let productDeleted = false;

    try {
      productDeleted = await deleteProductFromCustomerShop(order);
    } catch (error) {
      productDeleted = false;
    }

    const archiveRes = await archiveCompletedOrder(orderId, order, productDeleted);

    if (!archiveRes.ok) {
      alert("Failed to archive completed order: " + await archiveRes.text());
      return;
    }

    const deleteOrderRes = await deleteActiveOrder(orderId);

    if (!deleteOrderRes.ok) {
      alert("Archived, but failed to remove active order: " + await deleteOrderRes.text());
      return;
    }

    if (productDeleted) {
      alert("✅ Order completed. Product deleted from customer shop.");
    } else {
      alert("✅ Order completed, but product was not found/deleted. Check product list manually.");
    }

    if (typeof loadOrders === "function") loadOrders();
    if (typeof loadProducts === "function") loadProducts();
  };
})();
</script>
