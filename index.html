<script>
    const SUPABASE_URL = "https://ikryvpvjbgplhnkcgtit.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_PVjsZN2CLSI8N_2fgU5ICg_J5Lc0XAr";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let selectedAccount = null;
    let selectedSeller = "";

    async function showAccounts(category) {
        const listBox = document.getElementById("accountList");
        const itemBox = document.getElementById("accountItems");
        const title = document.getElementById("accountListTitle");

        title.innerText = category.replace("level_", "Level ").replaceAll("_", "-") + " Accounts";
        itemBox.innerHTML = "<p>Loading accounts...</p>";
        listBox.style.display = "block";
        listBox.scrollIntoView({ behavior: "smooth", block: "start" });

        const { data, error } = await db
            .from("accounts")
            .select("*")
            .eq("category", category)
            .order("created_at", { ascending: false });

        if (error) {
            itemBox.innerHTML = "<p>" + error.message + "</p>";
            return;
        }

        if (!data || data.length === 0) {
            itemBox.innerHTML = "<p>No accounts available in this category yet.</p>";
            return;
        }

        itemBox.innerHTML = "";

        data.forEach(account => {
            const item = document.createElement("div");
            item.className = "account-item";
            item.innerHTML = `
                <strong>${account.name}</strong>
                <span>${account.level} • ₱${account.price} • ${account.region || "No region"}</span>
            `;
            item.onclick = function() {
                openAccount(account);
            };
            itemBox.appendChild(item);
        });
    }

    function openAccount(account) {
        selectedAccount = account;

        document.getElementById("accountImage").src = account.image_url || "";
        document.getElementById("infoAccount").innerText = account.name || "";
        document.getElementById("infoLevel").innerText = account.level || "";
        document.getElementById("infoPrice").innerText = account.price || "";
        document.getElementById("infoNickname").innerText = account.nickname || "N/A";
        document.getElementById("infoRegion").innerText = account.region || "N/A";
        document.getElementById("infoUid").innerText = account.uid || "N/A";
        document.getElementById("infoDetails").innerText = account.details || "No extra details.";

        document.getElementById("accountPopup").style.display = "flex";
    }

    function openSellerPopup() {
        document.getElementById("accountPopup").style.display = "none";
        document.getElementById("sellerPopup").style.display = "flex";
    }

    function openGcash(seller) {
        selectedSeller = seller;

        document.getElementById("sellerPopup").style.display = "none";
        document.getElementById("gcashPopup").style.display = "flex";

        document.getElementById("gcashAccount").innerText = selectedAccount.name + " - " + selectedAccount.level;
        document.getElementById("gcashSeller").innerText = selectedSeller;
        document.getElementById("paymentAmount").innerText = selectedAccount.price;

        document.getElementById("formAccount").value = selectedAccount.name;
        document.getElementById("formLevel").value = selectedAccount.level;
        document.getElementById("formSeller").value = selectedSeller;
        document.getElementById("formAmount").value = "₱" + selectedAccount.price;
    }

    function backToAccount() {
        document.getElementById("sellerPopup").style.display = "none";
        document.getElementById("accountPopup").style.display = "flex";
    }

    function backToSeller() {
        document.getElementById("gcashPopup").style.display = "none";
        document.getElementById("sellerPopup").style.display = "flex";
    }

    function closePopups() {
        document.getElementById("accountPopup").style.display = "none";
        document.getElementById("sellerPopup").style.display = "none";
        document.getElementById("gcashPopup").style.display = "none";
    }
</script>
